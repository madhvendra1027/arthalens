spring:
  application:
    name: arthalens-api

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:arthalens}
    username: ${POSTGRES_USER:arthalens}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

server:
  port: ${API_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

arthalens:
  cors:
    allowed-origins: ${API_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8001}
  ml-service:
    base-url: ${ML_SERVICE_BASE_URL:http://localhost:8002}

logging:
  level:
    com.arthalens: INFO
    org.springframework.web: WARN
  pattern:
    console: '{"timestamp":"%d{ISO8601}","level":"%level","logger":"%logger{36}","message":"%msg","requestId":"%X{requestId}"}%n'
