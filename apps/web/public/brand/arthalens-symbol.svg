<svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="symBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#09121d" />
      <stop offset="100%" stop-color="#03070d" />
    </radialGradient>
    <radialGradient id="globeSphere" cx="42%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#1e2c3f" stop-opacity="0.8" />
      <stop offset="65%" stop-color="#0a121e" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#02060b" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="sculptLeft" x1="42" y1="24" x2="68" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF6F0" />
      <stop offset="35%" stop-color="#EFE7DC" />
      <stop offset="70%" stop-color="#DFD5C6" />
      <stop offset="100%" stop-color="#C8BBA8" />
    </linearGradient>
    <linearGradient id="sculptRight" x1="68" y1="24" x2="98" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DFD5C6" />
      <stop offset="50%" stop-color="#B4A590" />
      <stop offset="100%" stop-color="#7B6C57" />
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7a59" />
      <stop offset="60%" stop-color="#d94e34" />
      <stop offset="100%" stop-color="#992612" />
    </radialGradient>
    <filter id="indiaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Midnight Base Tile -->
  <rect width="128" height="128" rx="26" fill="url(#symBg)" />
  <rect width="126" height="126" x="1" y="1" rx="25" stroke="rgba(255,255,255,0.09)" stroke-width="1" fill="none" />

  <!-- Technical Reticle Crosshairs -->
  <line x1="64" y1="8" x2="64" y2="120" stroke="#38bdf8" stroke-width="0.6" stroke-dasharray="2 3" opacity="0.4" />
  <line x1="8" y1="64" x2="120" y2="64" stroke="#38bdf8" stroke-width="0.6" stroke-dasharray="2 3" opacity="0.4" />
  <circle cx="64" cy="64" r="52" stroke="#38bdf8" stroke-width="0.5" stroke-dasharray="1 4" opacity="0.25" />

  <!-- Dimensional Globe Sphere -->
  <circle cx="62" cy="62" r="39" fill="url(#globeSphere)" stroke="rgba(148,163,184,0.3)" stroke-width="0.9" />

  <!-- Longitude & Latitude Graticule Lines -->
  <ellipse cx="62" cy="62" rx="39" ry="17" stroke="rgba(148,163,184,0.2)" stroke-width="0.6" fill="none" />
  <ellipse cx="62" cy="62" rx="17" ry="39" stroke="rgba(148,163,184,0.2)" stroke-width="0.6" fill="none" />
  <ellipse cx="62" cy="62" rx="29" ry="39" stroke="rgba(148,163,184,0.15)" stroke-width="0.5" fill="none" />

  <!-- India Illuminated LED Matrix Pattern -->
  <g fill="#ff5a36" filter="url(#indiaGlow)">
    <circle cx="51" cy="46" r="1.3" />
    <circle cx="53" cy="47" r="1.3" />
    <circle cx="50" cy="49" r="1.3" />
    <circle cx="52" cy="50" r="1.5" />
    <circle cx="54" cy="50" r="1.5" />
    <circle cx="56" cy="49" r="1.3" />
    <circle cx="49" cy="52" r="1.4" />
    <circle cx="51" cy="52" r="1.6" />
    <circle cx="53" cy="53" r="1.6" />
    <circle cx="55" cy="52" r="1.5" />
    <circle cx="58" cy="51" r="1.3" />
    <circle cx="60" cy="51" r="1.3" />
    <circle cx="50" cy="55" r="1.5" />
    <circle cx="52" cy="55" r="1.7" />
    <circle cx="54" cy="55" r="1.7" />
    <circle cx="56" cy="54" r="1.5" />
    <circle cx="51" cy="58" r="1.6" />
    <circle cx="53" cy="58" r="1.6" />
    <circle cx="55" cy="57" r="1.4" />
    <circle cx="52" cy="61" r="1.5" />
    <circle cx="54" cy="61" r="1.5" />
    <circle cx="53" cy="64" r="1.4" />
    <circle cx="54" cy="67" r="1.2" />
    <circle cx="55" cy="70" r="1.0" />
  </g>

  <!-- Orbital Rings with Vermilion Accent -->
  <path d="M21 66 C 25 43, 89 33, 107 58 C 115 69, 103 83, 86 87" stroke="#d94e34" stroke-width="1.5" fill="none" opacity="0.9" />
  <path d="M21 66 C 17 79, 37 93, 59 93" stroke="#d94e34" stroke-width="1" stroke-dasharray="2 2" fill="none" opacity="0.5" />

  <!-- Orbiting Satellite Node -->
  <circle cx="97" cy="44" r="4.5" fill="url(#nodeGlow)" />
  <circle cx="97" cy="44" r="2" fill="#fff" opacity="0.95" />

  <!-- Sculpted Monumental Letter 'A' (Chiseled Serif) -->
  <!-- Left Column & Outward Serif -->
  <path d="M 40 95 L 31 95 C 35 92, 38 89, 40 84 L 52 53 C 50 54, 48 56, 46 58 L 44 55 C 48 49, 53 42, 57 36 L 68 22 L 72 26 L 54 75 C 50 86, 47 93, 40 95 Z" fill="url(#sculptLeft)" />
  
  <!-- Right Chiseled Column & Inward Shadow Face -->
  <path d="M 68 22 L 74 27 L 105 85 C 108 90, 111 92, 114 95 L 87 95 C 90 92, 91 89, 88 84 L 84 73 L 53 73 L 68 22 Z" fill="url(#sculptRight)" />
  
  <!-- Sculpted Bevel Highlight on Right Column -->
  <path d="M 68 22 L 73 26 L 86 73 L 60 73 Z" fill="url(#sculptLeft)" opacity="0.95" />
  
  <!-- Chiseled Apex Detail -->
  <polygon points="68,22 74,27 71,29 66,24" fill="#FFFFFF" opacity="0.8" />
</svg>
