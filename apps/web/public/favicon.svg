  <ellipse cx="62" cy="62" rx="40" ry="17" stroke="rgba(148,163,184,0.25)" stroke-width="0.8" fill="none" />
  <ellipse cx="62" cy="62" rx="17" ry="40" stroke="rgba(148,163,184,0.25)" stroke-width="0.8" fill="none" />

