<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="48" height="48" rx="10" fill="#141416" />
  <!-- Precision Optics Crosshairs -->
  <line x1="21" y1="9" x2="21" y2="33" stroke="#60a5fa" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.5" />
  <line x1="9" y1="21" x2="33" y2="21" stroke="#60a5fa" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.5" />

  <!-- Lens Body -->
  <circle cx="21" cy="21" r="12.5" fill="url(#lensGlassGrad)" stroke="url(#lensRimGrad)" stroke-width="2.5" />

  <!-- Optical Glare Arc -->
  <path d="M12 16 A 10.5 10.5 0 0 1 25 10.5" stroke="#bae6fd" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />

  <!-- Rupee Symbol -->
  <g stroke="url(#rupeeGrad)" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 15.5 h11" />
    <path d="M15 19.5 h8.5" />
    <path d="M15 15.5 v9.5 c2.2 0 4.8 -.3 6 -2 1.3 -1.6 1.1 -4.8 -.2 -6.2" />
    <path d="M18.5 25 l6 7" />
  </g>

  <!-- Handle Bracket -->
  <path d="M30 30 L32.5 32.5" stroke="#93c5fd" stroke-width="3.2" stroke-linecap="round" />
  <!-- Handle -->
  <path d="M32.5 32.5 L41.5 41.5" stroke="url(#handleGrad)" stroke-width="4" stroke-linecap="round" />
  <circle cx="41.5" cy="41.5" r="1.5" fill="#f59e0b" />

  <defs>
    <radialGradient id="lensGlassGrad" cx="38%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#1e3a8a" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </radialGradient>
    <linearGradient id="lensRimGrad" x1="9" y1="9" x2="33" y2="33" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="rupeeGrad" x1="15" y1="14" x2="26" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="handleGrad" x1="32" y1="32" x2="41" y2="41" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="40%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
</svg>
